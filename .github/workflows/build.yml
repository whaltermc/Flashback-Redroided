name: Build

on:
  push:
    branches: ["1.21", "26.x", "main"]
    tags: ["v*"]
  pull_request:
    branches: ["1.21", "26.x", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [1.21, 26.x, main]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: |
          chmod +x gradlew
          ./gradlew build --parallel

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: flashback-redroided-${{ matrix.branch }}-${{ github.sha }}
          path: |
            build/libs/fba-*-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Publish to Modrinth
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew modrinth --no-configuration-cache --parallel

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built jars
        uses: actions/download-artifact@v4
        with:
          pattern: flashback-redroided-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true

  dev-release:
    if: github.ref_type == 'branch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        branch: [1.21, 26.x, main]
    steps:
      - name: Download jar for ${{ matrix.branch }}
        uses: actions/download-artifact@v4
        with:
          name: flashback-redroided-${{ matrix.branch }}-${{ github.sha }}
          path: dist

      - name: Publish rolling dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ matrix.branch }}
          name: Dev build (${{ matrix.branch }})
          body: Latest dev build from ${{ matrix.branch }} @ ${{ github.sha }}
          prerelease: true
          files: dist/*.jar